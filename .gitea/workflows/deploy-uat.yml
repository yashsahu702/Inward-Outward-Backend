name: Deploy UAT backend
on:
  pull_request:
    branches: [release/uat]
    types: [closed]

jobs:
  deploy:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: [growth-hub-v1]
    steps:
      - uses: actions/checkout@v4
        with:
          path: backend

      - name: Sync code to UAT dir
        run: |
          rm -rf /home/growth_hub/backend-uat/growth-hub-rr-backend
          mkdir -p /home/growth_hub/backend-uat
          cp -R ./backend /home/growth_hub/backend-uat/growth-hub-rr-backend

      - name: Restart PM2 (UAT)
        run: |
          cd /home/growth_hub
          pm2 restart ecosystem.config.js --only GH-backend-uat
